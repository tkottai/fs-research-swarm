services:
  postgres:
    image: postgres:16
    container_name: fs-swarm-postgres
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: fs_research_swarm
    ports:
      - "5432:5432"
    volumes:
      - swarm_pgdata:/var/lib/postgresql/data

volumes:
  swarm_pgdata:
